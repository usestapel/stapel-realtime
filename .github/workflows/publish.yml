name: Publish to PyPI
on:
  push:
    tags: ["v*"]

# Publication is gated on green tests (library-standard §7.5): the 0.8 wave
# shipped 18 packages to PyPI on a red test job because publish.yml only
# listened to the tag. A red test is no publication, full stop.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stapel-core (git main)
        run: pip install "stapel-core[channels] @ git+https://github.com/usestapel/stapel-core.git"
      - name: Install
        run: pip install -e ".[all]"
      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501
      - name: Tests
        run: |
          pip install pytest pytest-django pytest-asyncio jsonschema "stapel-tools>=0.42.0"
          pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build --quiet
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
