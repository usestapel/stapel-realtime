name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Editable (library-standard §7.6): tests/ are excluded from the wheel, so
      # installing the built package would leave `stapel_realtime.tests.*`
      # unimportable — the systemic incident of the 0.8 wave. The release track
      # below is what proves the wheel.
      - name: Install
        run: pip install -e ".[all]"

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: Import check
        run: python -c "import stapel_realtime; print('import OK')"

      - name: Install test dependencies
        # stapel-tools drives the contract drift gate in tests/test_contract.py.
        run: pip install pytest pytest-django pytest-cov pytest-asyncio jsonschema "stapel-tools>=0.42.0"

      - name: Tests with coverage
        run: |
          pytest tests/ \
            --cov=stapel_realtime \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-realtime
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  core-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Dev track: the core off git main, for fast feedback while core and
      # library are co-developed. The release track below installs the pinned
      # core from PyPI, exactly as a user would.
      - name: Install stapel-core (git main)
        run: pip install "stapel-core[channels] @ git+https://github.com/usestapel/stapel-core.git"

      # Editable (library-standard §7.6): tests/ are excluded from the wheel, so
      # installing the built package would leave `stapel_realtime.tests.*`
      # unimportable — the systemic incident of the 0.8 wave. The release track
      # below is what proves the wheel.
      - name: Install
        run: pip install -e ".[all]"

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: Import check
        run: python -c "import stapel_realtime; print('import OK')"

      - name: Install test dependencies
        # stapel-tools drives the contract drift gate in tests/test_contract.py.
        run: pip install pytest pytest-django pytest-cov pytest-asyncio jsonschema "stapel-tools>=0.42.0"

      - name: Tests with coverage
        run: |
          pytest tests/ \
            --cov=stapel_realtime \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-realtime
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Release track (library-standard §7.4): install the wheel the way a user
  # would, resolving stapel-core from PyPI strictly by the declared pin, with
  # no git-main core anywhere. This is what catches a "pin into the void" and
  # drift between the core's branch and its published wheel. Advisory until the
  # whole dependency graph is on the index.
  release-track:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and install the wheel as a user would
        run: |
          pip install build --quiet
          python -m build
          pip install "$(ls dist/*.whl)[all]"
      - name: Import smoke (no tests — they are not in the wheel, by design)
        run: |
          cd /
          python - <<'PY'
          # The Django-free half first: a module that only builds stream keys or
          # parses envelopes must never need a configured host.
          from stapel_realtime import envelope, streams
          assert envelope.frame("ping")["v"] == 1
          assert streams.group_name("recordings:ws:42") == "recordings.ws.42"

          # Then the half that does, with the smallest host that can exist.
          import django
          from django.conf import settings
          settings.configure(
              INSTALLED_APPS=["stapel_realtime"],
              DATABASES={},
              CHANNEL_LAYERS={"default": {"BACKEND": "channels.layers.InMemoryChannelLayer"}},
          )
          django.setup()
          from stapel_realtime import asgi, checks, consumers, delivery, testing  # noqa: F401
          assert consumers.EphemeralStreamConsumer is not None
          assert asgi.build_websocket_application(patterns=[]) is not None
          print("release-track import OK")
          PY
      - name: The contract artifacts are IN the wheel
        run: |
          python -m zipfile -l dist/*.whl > /tmp/wheel.txt
          grep -q "docs/capabilities.json" /tmp/wheel.txt
          grep -q "docs/llms.txt" /tmp/wheel.txt
          grep -q "schemas/wire/envelope.v1.json" /tmp/wheel.txt
          grep -q "py.typed" /tmp/wheel.txt
      - name: Tests, e2e and caches are NOT in the wheel
        run: |
          test "$(grep -c 'stapel_realtime/tests/' /tmp/wheel.txt)" -eq 0
          test "$(grep -c 'stapel_realtime/e2e/' /tmp/wheel.txt)" -eq 0
          test "$(grep -c '__pycache__' /tmp/wheel.txt)" -eq 0
