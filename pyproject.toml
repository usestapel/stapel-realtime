[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-realtime"
version = "0.2.1"
description = "Realtime delivery substrate for the Stapel framework — the Signal primitive on the wire"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "realtime", "websocket", "channels", "signal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # 0.33 is the minor that shipped the Signal primitive: `comm.signal()`, the
    # SIGNAL_TRANSPORT seam this package registers into, `comm.stream_key()`
    # (whose validation `streams.py` re-exports rather than duplicating), and
    # the reserved wire frame types the envelope here is checked against.
    # Anything older has no seam to plug into, so the floor is not a
    # preference. 0.33.2 specifically: it is where the reserved frame-type set
    # became equal to this package's, so the two halves of the wire contract
    # agree by construction rather than by a pinned difference.
    #
    # The ceiling is <1.0, not the one-minor <0.34 that shipped in 0.1.1. A
    # pre-1.0 substrate that pins one minor of the core freezes every module
    # built on it at that minor — and this one is meant to be built on by all
    # of them. It bit immediately: stapel-chat 0.3.0 moved its floor to core
    # 0.41 and could not resolve at all.
    #
    # A one-minor window is the right discipline where the guarantee is a
    # version number. Here it is not: `tests/test_envelope.py` asserts, in both
    # directions, that this package's frame-type set and the core's
    # RESERVED_FRAME_TYPES are equal. That test is the gate — it fails the
    # moment either half grows a type the other does not know, which is the
    # exact break the pin was standing in for. The range only has to name the
    # floor.
    #
    # 0.2.0 moves that floor from 0.33.2 to 0.45.0 for a second, equally
    # non-negotiable reason: the presence registry writes through
    # `stapel_core.core.fleet_cache`, which 0.45.0 extracted. Plain
    # `django.core.cache` is namespaced per service by KEY_PREFIX, and the
    # service holding the socket is never guaranteed to be the service asking
    # whether that user is live — written there, the oracle would answer "no"
    # from every peer, which is the exact per-service illusion fleet_cache
    # exists to end. A floor, not a preference.
    "stapel-core>=0.45.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-realtime"
Repository = "https://github.com/usestapel/stapel-realtime"
Documentation = "https://github.com/usestapel/stapel-realtime#readme"
Changelog = "https://github.com/usestapel/stapel-realtime/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-realtime/issues"

[project.optional-dependencies]
# The envelope, the stream-key canon and the delivery seam work without
# Channels (they degrade to a silent no-op — that is the contract). Serving a
# socket does not: consumers, the test harness and the host assembly need it.
channels = ["stapel-core[channels]>=0.45.0,<1.0", "channels>=4.0,<5"]
# The v1 fan-out transport across replicas. Single-worker hosts can run the
# in-memory layer; anything else is realtime.E001.
redis = ["channels-redis>=4.2,<5"]
# `stapel_realtime.testing` — the harness a module uses to test its own
# consumer. daphne is here and not in `channels` because importing anything
# from `channels.testing` executes that package's __init__, which pulls in
# ChannelsLiveServerTestCase and therefore an ASGI server. A production host
# serving sockets should not be made to install one; a test run may.
testing = ["channels>=4.0,<5", "daphne>=4,<5"]
all = [
    "stapel-core[channels]>=0.45.0,<1.0",
    "channels>=4.0,<5",
    "channels-redis>=4.2,<5",
    "daphne>=4,<5",
]

[tool.setuptools]
package-dir = {"stapel_realtime" = "."}
packages = ["stapel_realtime"]

[tool.setuptools.package-data]
# The contract documents ship IN THE WHEEL: that is what makes
# `stapel-catalog --from-installed` possible, i.e. what turns catalog
# freshness from somebody's discipline into a property of the lockfile.
# A module that keeps them repo-only publishes code an agent cannot read.
# `schemas/wire/*.json` is the deliberate L1 exception (spec §4.1): the wire
# envelope is a versioned contract between a backend consumer and a browser
# client written by different hands, so it ships as a schema. `schemas/
# functions/*.json` is not an exception at all — it is the ordinary rule for a
# comm surface, and it must reach site-packages because the core's schema
# autoloader globs `<app path>/schemas` at runtime, not the repo.
stapel_realtime = [
    "py.typed",
    "docs/capabilities.json",
    "docs/llms.txt",
    "schemas/**/*.json",
    "CONFIG.MD",
]

[tool.stapel.readme]
# On PyPI since 0.1.1; the flag stayed false for three more releases and the
# README kept telling readers to install from source. A badge that lies about
# where the package lives is the small version of the catalog problem this
# pipeline exists for.
pypi = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"
# Consumers are async by nature; every socket test is a coroutine.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    # The live two-worker harness is exercised by `make e2e` against a real
    # redis, not by the unit suite; counting it as uncovered library code would
    # make the ratchet lie in both directions.
    "*/e2e/*",
]
